---
- name: Déploiement Locatic sur minikube
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Vérifier que minikube est disponible
      ansible.builtin.command: minikube status
      register: minikube_status
      changed_when: false
      failed_when: minikube_status.rc != 0

    - name: Vérifier que kubectl est disponible
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: Lire les outputs Terraform
      ansible.builtin.command: terraform output -json
      args:
        chdir: "{{ terraform_dir }}"
      register: terraform_outputs
      changed_when: false

    - name: Charger les variables Terraform
      ansible.builtin.set_fact:
        tf: "{{ terraform_outputs.stdout | from_json }}"

    - name: Appliquer les manifests Kubernetes
      ansible.builtin.command: >
        kubectl apply -f {{ k8s_manifests_dir }}/{{ item }}
        --namespace {{ tf.namespace.value | default(namespace) }}
      loop:
        - app/configmap.yaml
        - app/deployment.yaml
        - app/service.yaml
        - nginx/configmap.yaml
        - nginx/deployment.yaml
        - nginx/service.yaml
        - monitoring/prometheus-configmap.yaml
        - monitoring/prometheus-deployment.yaml
        - monitoring/prometheus-service.yaml
        - monitoring/grafana-configmap.yaml
        - monitoring/grafana-deployment.yaml
        - monitoring/grafana-service.yaml
      environment:
        LOCATIC_NAMESPACE: "{{ tf.namespace.value | default(namespace) }}"
        LOCATIC_IMAGE: "{{ tf.docker_image.value | default(docker_image) }}"
        LOCATIC_REPLICAS: "{{ tf.app_replicas.value | default(app_replicas) | string }}"
        LOCATIC_PVC: "{{ tf.pvc_name.value | default(pvc_name) }}"

    - name: Mettre à jour l'image de l'application
      ansible.builtin.command: >
        kubectl set image deployment/locatic-app
        locatic={{ tf.docker_image.value | default(docker_image) }}
        -n {{ tf.namespace.value | default(namespace) }}
      register: set_image
      changed_when: "'configured' in set_image.stdout or 'updated' in set_image.stdout"

    - name: Attendre le déploiement de l'application
      ansible.builtin.command: >
        kubectl rollout status deployment/locatic-app
        -n {{ tf.namespace.value | default(namespace) }}
        --timeout=180s
      changed_when: false

    - name: Attendre le déploiement de Nginx
      ansible.builtin.command: >
        kubectl rollout status deployment/locatic-nginx
        -n {{ tf.namespace.value | default(namespace) }}
        --timeout=120s
      changed_when: false

    - name: Afficher l'URL d'accès minikube
      ansible.builtin.command: minikube service locatic-nginx -n {{ tf.namespace.value | default(namespace) }} --url
      register: service_url
      changed_when: false

    - name: Résumé du déploiement
      ansible.builtin.debug:
        msg:
          - "Namespace: {{ tf.namespace.value | default(namespace) }}"
          - "Image: {{ tf.docker_image.value | default(docker_image) }}"
          - "URL Nginx: {{ service_url.stdout_lines | join(', ') }}"
