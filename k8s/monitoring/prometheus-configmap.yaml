apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: locatic-app
        metrics_path: /metrics
        static_configs:
          - targets: ["locatic-app:8080"]
            labels:
              service: locatic-app

      - job_name: nginx
        metrics_path: /nginx-health
        static_configs:
          - targets: ["locatic-nginx:80"]
            labels:
              service: locatic-nginx

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - locatic
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

  alerts.yml: |
    groups:
      - name: locatic-alerts
        rules:
          - alert: LocaticAppDown
            expr: up{job="locatic-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Application Locatic indisponible"
              description: "Prometheus ne scrape plus l'application Locatic."

          - alert: NginxDown
            expr: up{job="nginx"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Nginx indisponible"
              description: "Le reverse proxy Nginx ne répond plus."
