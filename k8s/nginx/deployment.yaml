apiVersion: apps/v1
kind: Deployment
metadata:
  name: locatic-nginx
  labels:
    app: locatic-nginx
    tier: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locatic-nginx
      tier: proxy
  template:
    metadata:
      labels:
        app: locatic-nginx
        tier: proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: locatic-nginx-config
